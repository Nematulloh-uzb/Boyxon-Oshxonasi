name: boyxon_mobile
description: "Boyxon Oshxonasi — milliy taomlar ilovasi (sayt bilan bir xil backend va dizayn)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP + sessiya
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Holat boshqaruvi
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.0
  cached_network_image: ^3.4.1

  # Saqlash / tizim
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  intl: any
  url_launcher: ^6.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
