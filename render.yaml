# =============================================================================
# Render Blueprint — Boyxon Oshxonasi
#
# Render Dashboard → New → Blueprint → bu reponi tanlang.
# Barcha sozlamalar shu yerdan o'qiladi (qo'lda kiritish shart emas).
#
# MUHIM: Environment Variables (secretlar) Dashboard → Environment'da
# `sync: false` bilan qo'shiladi — ular bu faylga YOZILMAYDI.
# =============================================================================

services:
  # ---------------------------------------------------------
  # Backend API (Node + Express + Socket.IO)
  # ---------------------------------------------------------
  - type: web
    name: boyxon-server
    runtime: node
    plan: free
    region: frankfurt
    # Repo ildizidan nisbiy yo'l — server shu papkada build/start bo'ladi
    rootDir: boyxon/server
    # 1) client (SPA) build  2) server TypeScript → dist/
    # Frontend endi shu servisdan beriladi (bitta origin → cross-site cookie yo'q).
    buildCommand: cd ../client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render o'zi beradigan PORT'ni tinglaydi (env.ts da PORT o'qiladi)
      - key: PORT
        value: "5000"
      # Render proksisi ortida — rate-limit to'g'ri ishlashi uchun 1
      - key: TRUST_PROXY
        value: "1"
      # Free instance (512MB) — Node GC heap limitini cheklaymiz, aks holda
      # tsc build yoki socket runtime "heap out of memory" bilan qulaydi.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      # --- Bitta origin (frontend + API shu servisdan) ---
      # CLIENT_URL'ning birinchisi OAuth redirect va email havolalari uchun ishlatiladi.
      - key: CLIENT_URL
        value: https://boyxon-server.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://boyxon-server.onrender.com/api/auth/google/callback
      # Client build vaqtida canonical/OG/sitemap uchun sayt manzili.
      - key: VITE_SITE_URL
        value: https://boyxon-server.onrender.com
      # --- Quyidagilar Dashboard → Environment'da `sync: false` bilan qo'shiladi ---
      # MONGODB_URI           = mongodb+srv://...
      # JWT_ACCESS_SECRET     = (48 hex)
      # JWT_REFRESH_SECRET    = (48 hex)
      # JWT_RESET_SECRET      = (48 hex)
      # ADMIN_EMAIL           = admin@boyxon.uz
      # ADMIN_PASSWORD        = (kuchli, >=12)
      # SMTP_USER / SMTP_PASS = (ixtiyoriy)
      # VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_EMAIL
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
      # CLOUDINARY_* (ixtiyoriy)

  # ---------------------------------------------------------
  # LEGACY: alohida statik frontend (ixtiyoriy zaxira).
  # Yangi arxitektura — frontend `boyxon-server` servisidan beriladi.
  # Tekshiruvdan keyin bu servisni Render Dashboard'dan o'chirish mumkin.
  # ---------------------------------------------------------
  - type: static_site
    name: boyxon-client
    plan: free
    rootDir: boyxon/client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    # Build paytida API manzili — server domeniga ishora qilishi kerak
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      # SPA: barcha yo'nalishlar index.html'ga (React Router ishlashi uchun)
      - type: rewrite
        source: /*
        destination: /index.html
    # Xavfsizlik header'lari (Lighthouse Best Practices + real himoya).
    # script-src'dan 'unsafe-inline' olib tashlandi — theme script alohida
    # /theme-init.js fayliga chiqarib berildi. style-src 'unsafe-inline'
    # framer-motion va Leaflet inline uslublariga kerak.
    # Trusted Types — DOM-based XSS himoyasi uchun.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://boyxon-server.onrender.com wss://boyxon-server.onrender.com https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; trusted-types 'safe-script' 'safe-url' 'html'"
