name: Boyxon APK (React Native — Expo)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API manzili (masalan https://boyxon-server.onrender.com/api)'
        required: false
        default: 'https://boyxon-server.onrender.com/api'
  push:
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boyxon/mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://boyxon-server.onrender.com/api' }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: boyxon/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: node ./node_modules/typescript/lib/tsc.js --noEmit

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --clean

      - name: Keystore fayl (agar sir mavjud bo'lsa)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "Release keystore yozildi."
          else
            echo "ANDROID_KEYSTORE_BASE64 yo'q — debug imzo bilan release build qilinadi."
          fi

      - name: Signing sozlamalari (release imzo bo'lsa)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          if not os.environ.get('KS_B64'):
              raise SystemExit(0)
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          block = """    signingConfigs {
          release {
              storeFile file('release.keystore')
              storePassword System.getenv('KS_PASS')
              keyAlias System.getenv('KEY_ALIAS')
              keyPassword System.getenv('KEY_PASS')
          }"""
          s = s.replace('    signingConfigs {', block, 1)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          p.write_text(s)
          print('build.gradle: release signing sozlandi.')
          PY

      - name: Build release APK
        working-directory: boyxon/mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: APK nomlash
        run: cp android/app/build/outputs/apk/release/app-release.apk boyxon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boyxon-apk
          path: boyxon/mobile/boyxon.apk
          retention-days: 30

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boyxon-apk
          path: ./apk
      - uses: softprops/action-gh-release@v2
        with:
          files: ./apk/boyxon.apk
          body: |
            Boyxon Oshxonasi — Android ilova (React Native, 1:1 dizayn).
            O'rnatish: `boyxon.apk` ni yuklab, "Noma'lum manba"ga ruxsat bering.
