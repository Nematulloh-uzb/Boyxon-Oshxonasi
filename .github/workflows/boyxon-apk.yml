name: Boyxon APK (Capacitor — sayt 1:1)

on:
  push:
    branches: [main]
    paths:
      - 'boyxon/client/**'
      - '.github/workflows/boyxon-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API manzili (masalan https://boyxon-server.onrender.com/api)'
        required: false
        default: 'https://boyxon-server.onrender.com/api'
      socket_url:
        description: 'Socket.IO manzili (masalan https://boyxon-server.onrender.com)'
        required: false
        default: 'https://boyxon-server.onrender.com'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boyxon/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: boyxon/client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web (1:1 sayt)
        env:
          VITE_API_URL: ${{ inputs.api_url || 'https://boyxon-server.onrender.com/api' }}
          VITE_SOCKET_URL: ${{ inputs.socket_url || 'https://boyxon-server.onrender.com' }}
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/boyxon.apk
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK (1:1 sayt ichida)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boyxon-apk
          path: boyxon/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boyxon-apk
          path: ./apk
      - run: mv ./apk/app-debug.apk ./apk/boyxon.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: ./apk/boyxon.apk
          body: |
            Boyxon Oshxonasi — Android ilova (sayt bilan 1:1).
            O'rnatish: `boyxon.apk` ni yuklab, "Noma'lum manba"ga ruxsat bering.
